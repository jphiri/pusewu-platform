# ============================================================
# Render Blueprint for the PUSEWU Digital Platform
# Creates a managed PostgreSQL database and a web service that
# serves BOTH the API and the frontend, and wires them together.
#
# Deploy: push this repo to GitHub, then in the Render dashboard
# choose New > Blueprint and point it at the repo. Render reads
# this file and creates everything. See DEPLOY_RENDER.md.
# ============================================================

databases:
  - name: pusewu-db
    databaseName: pusewu
    user: pusewu
    plan: basic-256mb          # ~$6/month managed Postgres with backups
    # region: oregon           # optional: pick the region nearest your users

services:
  - type: web
    name: pusewu
    runtime: docker
    plan: starter              # ~$7/month always-on (no sleeping)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .           # build context is the repo root (Dockerfile copies backend/ and frontend/)
    # region: oregon           # keep the same region as the database
    healthCheckPath: /api/health
    # Run schema migration + create the initial admin BEFORE traffic is sent,
    # then the container's own CMD starts the server.
    preDeployCommand: "node scripts/migrate.js && node scripts/seed.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: FRONTEND_DIR
        value: /app/frontend
      # Database connection string, injected automatically by Render:
      - key: DATABASE_URL
        fromDatabase:
          name: pusewu-db
          property: connectionString
      # Managed Postgres requires SSL:
      - key: PGSSL
        value: "false"
      # JWT secret is generated once by Render and kept stable:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BCRYPT_ROUNDS
        value: "12"
      # Same-origin, so CORS_ORIGIN is just the site's own URL.
      # After the first deploy, set this to your custom domain, e.g.
      # https://www.pusewu.org.zm  (see DEPLOY_RENDER.md).
      - key: CORS_ORIGIN
        value: "https://pusewu.onrender.com"
      # ---- Initial administrator (first deploy only) ----
      # Set a strong password here in the dashboard before applying,
      # or leave blank and Render's logs will show a generated one once.
      - key: ADMIN_EMAIL
        value: admin@pusewu.org.zm
      - key: ADMIN_PASSWORD
        sync: false            # you enter this in the dashboard; not stored in git
      - key: ADMIN_FIRST_NAME
        value: System
      - key: ADMIN_SURNAME
        value: Administrator
